<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbIQ — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <div class="topbar">

            <div class="brand">
                <div class="brand-mark">IQ</div>
                <div>
                    <div class="brand-name">ClimbIQ</div>
                    <div class="brand-sub">Aptitude Trail</div>
                </div>
            </div>

            <div class="nav">
                <button onclick="location.href='dashboard.html'" class="active">
                    Dashboard
                </button>

                <button onclick="location.href='trail.html'">
                    Level Trail
                </button>

                <button onclick="location.href='calendar.html'">
                    Calendar
                </button>

                <button id="nav-history">
                    Login History
                </button>
            </div>

            <div>
                <span id="whoami"></span>
                <button id="btn-logout" class="btn btn-ghost btn-sm">
                    Log out
                </button>
            </div>

        </div>


        <!-- DASHBOARD -->

        <div id="dashboard">

            <div class="stat-strip">

                <div class="stat-card">
                    <div class="label">Levels Cleared</div>
                    <div class="value gold" id="stat-levels">
                        0 / 20
                    </div>
                </div>

                <div class="stat-card">
                    <div class="label">Tests Taken</div>
                    <div class="value" id="stat-tests">
                        0
                    </div>
                </div>

                <div class="stat-card">
                    <div class="label">Correct Answers</div>
                    <div class="value teal" id="stat-correct">
                        0
                    </div>
                </div>

                <div class="stat-card">
                    <div class="label">Incorrect Answers</div>
                    <div class="value coral" id="stat-incorrect">
                        0
                    </div>
                </div>

            </div>


            <div class="trail-header">

                <h1>Welcome back</h1>

                <p id="dash-msg">
                    Pick up where you left off on the trail below.
                </p>

            </div>


            <div id="dash-recent"></div>

        </div>

    </div>

    <script src="js/dashboard.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>

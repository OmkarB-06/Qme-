<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClimbIQ — Calendar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             TOP NAVIGATION
        ========================== -->

        <div class="topbar">

            <div class="brand">

                <div class="brand-mark">
                    IQ
                </div>

                <div>
                    <div class="brand-name">
                        ClimbIQ
                    </div>

                    <div class="brand-sub">
                        Aptitude Trail
                    </div>
                </div>

            </div>


            <div class="nav">

                <button onclick="location.href='dashboard.html'">
                    Dashboard
                </button>

                <button onclick="location.href='trail.html'">
                    Level Trail
                </button>

                <button class="active" onclick="location.href='calendar.html'">
                    Calendar
                </button>

                <button id="nav-history">
                    Login History
                </button>

            </div>


            <div>

                <span id="whoami"></span>

                <button id="btn-logout" class="btn btn-ghost btn-sm">
                    Log out
                </button>

            </div>

        </div>


        <!-- =========================
             CALENDAR
        ========================== -->

        <div id="calendar-view">

            <div class="cal-head">

                <h1 id="cal-month-label">
                    August 2026
                </h1>

                <div class="cal-nav">

                    <button id="cal-prev">
                        ←
                    </button>

                    <button id="cal-next">
                        →
                    </button>

                </div>

            </div>


            <!-- =========================
                 DAYS OF WEEK
            ========================== -->

            <div class="cal-grid" id="cal-dow-row">
            </div>


            <!-- =========================
                 CALENDAR DATES
            ========================== -->

            <div class="cal-grid" id="cal-grid">
            </div>


            <!-- =========================
                 LEGEND
            ========================== -->

            <div class="cal-legend">

                <div class="item">

                    <span class="dot" style="background:var(--accent-teal);">
                    </span>

                    Passed (≥40%)

                </div>


                <div class="item">

                    <span class="dot" style="background:var(--accent-coral);">
                    </span>

                    Below 40%

                </div>


                <div class="item">

                    <span class="dot" style="background:var(--accent-gold);">
                    </span>

                    Today

                </div>

            </div>


            <!-- =========================
                 SELECTED DAY
            ========================== -->

            <div class="day-list" id="day-list">
            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Authentication -->
    <script src="js/auth.js"></script>

    <!-- Storage / Data -->
    <script src="js/storage.js"></script>

    <!-- Utility functions -->
    <script src="js/utils.js"></script>

    <!-- Question system -->
    <script src="js/question-generator.js"></script>
    <script src="js/question-data.js"></script>
    <script src="js/question-engine.js"></script>

    <!-- Application state -->
    <script src="js/state.js"></script>

    <!-- UI modules -->
    <script src="js/dashboard.js"></script>
    <script src="js/trail.js"></script>
    <script src="js/test.js"></script>

    <!-- Calendar -->
    <script src="js/calendar.js"></script>

    <!-- Application initialization -->
    <script src="js/app.js"></script>

</body>

</html>

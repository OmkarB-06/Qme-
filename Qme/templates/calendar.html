<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Question Me - Calendar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="brand">

            <div class="brand-mark">IQ</div>

            <div>
                <div class="brand-name">Question Me</div>
                <div class="brand-sub">Aptitude Test</div>
            </div>

        </div>


        <div class="nav">

            <button onclick="location.href='/dashboard'">
                Dashboard
            </button>

            <button onclick="location.href='/trail'">
                Level Trail
            </button>

            <button class="active">
                Calendar
            </button>
            <button onclick="location.href='/about'">
                About
            </button>
            <button onclick="location.href='/help'">
                Help
            </button>
            <button id="logout-btn" class="logout-btn">
                Logout
            </button>

        </div>

    </div>


    <!-- CALENDAR -->

    <div id="view-calendar" >
    <div class="cal-head">
      <h1 id="cal-month-label">August 2026</h1>
      <div class="cal-nav">
        <button id="cal-prev">‹</button>
        <button id="cal-next">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-dow-row"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
    <div class="cal-legend">
      <div class="item"><span class="dot" style="background:var(--accent-teal);"></span>Passed (≥40%)</div>
      <div class="item"><span class="dot" style="background:var(--accent-coral);"></span>Below 40%</div>
      <div class="item"><span class="dot" style="background:var(--accent-gold);"></span>Today</div>
    </div>
    <div class="day-list" id="day-list"></div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script src="{{ url_for('static', filename='js/auth-guard.js') }}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Question Me - Test</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="app">

    <!-- TEST HEADER -->

    <div class="test-head">

        <div>
            <div
                style="font-family:'Space Grotesk',sans-serif;
                       font-size:19px;
                       font-weight:700;"
                id="test-title">
                Level 1
            </div>

            <div
                style="color:var(--text-muted);
                       font-size:13px;"
                id="test-sub">
                Question 1 of 15
            </div>
        </div>

        <div class="timer" id="timer">
            15:00
        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-track">

        <div
            class="progress-fill"
            id="progress-fill"
            style="width:6.6%;">
        </div>

    </div>


    <!-- QUESTION -->

    <div class="qcard" id="qcard"></div>


    <!-- NAVIGATION -->

    <div class="qnav">

        <div class="side">

            <button
                class="btn btn-ghost btn-sm"
                id="btn-prev">
                ← Prev
            </button>

        </div>


        <div class="side">

            <button
                class="btn btn-ghost btn-sm"
                id="btn-next">
                Next →
            </button>

            <button
                class="btn btn-primary btn-sm"
                id="btn-submit">
                Submit Test
            </button>

        </div>

    </div>
    <!-- RESULT VIEW -->
<div id="view-result" class="hidden">

    <div class="result-hero">

        <div class="grade-badge" id="result-grade">
            A
        </div>

        <h2 id="result-title">
            Level 1 complete
        </h2>

        <p id="result-sub">
            Nice work.
        </p>

    </div>


    <div class="result-grid">

        <div class="rbox">
            <div class="n teal" id="r-correct">0</div>
            <div class="l">Correct</div>
        </div>

        <div class="rbox">
            <div class="n coral" id="r-incorrect">0</div>
            <div class="l">Incorrect</div>
        </div>

        <div class="rbox">
            <div class="n" id="r-unattempted">0</div>
            <div class="l">Unattempted</div>
        </div>

    </div>


    <div class="stat-strip"
         style="grid-template-columns:repeat(2,1fr);">

        <div class="stat-card">

            <div class="label">Marks</div>

            <div class="value gold" id="r-marks">
                0 / 15
            </div>

        </div>


        <div class="stat-card">

            <div class="label">Percentage</div>

            <div class="value" id="r-percent">
                0%
            </div>

        </div>

    </div>


    <button
        class="btn btn-primary"
        id="btn-review-toggle"
        style="margin-bottom:10px;">
        Review Answers
    </button>


    <button
        class="btn btn-ghost"
        id="btn-back-trail">
        Back to Trail
    </button>


    <div
        id="review-list"
        style="margin-top:18px;"
        class="hidden">
    </div>

</div>


    <!-- QUESTION NUMBERS -->

    <div
        class="jumpgrid"
        id="jumpgrid">
    </div>

</div>
<script>
    const CURRENT_LEVEL = {{ level|int }};
</script>

<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/question_data.js') }}"></script>
<script src="{{ url_for('static', filename='js/question_generator.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/test.js') }}"></script>

<script>
    startTest(CURRENT_LEVEL);
</script>
<script src="{{ url_for('static', filename='js/auth-guard.js') }}"></script>
</body>

</html>

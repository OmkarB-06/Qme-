<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question Me - Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="brand">
            <div class="brand-mark">IQ</div>

            <div>
                <div class="brand-name">Question Me</div>
                <div class="brand-sub">Aptitude Test</div>
            </div>
        </div>

        <div class="nav">

            <button onclick="location.href='/dashboard'" class="active">
                Dashboard
            </button>

            <button onclick="location.href='/trail'">
                Level Trail
            </button>

            <button onclick="location.href='/calendar'">
                Calendar
            </button>
            <button onclick="location.href='/about'">
                About
            </button>
            <button onclick="location.href='/help'">
                Help
            </button>
            <button id="logout-btn" class="logout-btn">
                Logout
            </button>

        </div>

    </div>


    <!-- DASHBOARD -->

    <div id="view-dashboard">

        <div class="stat-strip">

            <div class="stat-card">
                <div class="label">Levels Cleared</div>
                <div class="value gold" id="stat-levels">
                    0 / 20
                </div>
            </div>

            <div class="stat-card">
                <div class="label">Tests Taken</div>
                <div class="value" id="stat-tests">
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="label">Correct Answers</div>
                <div class="value teal" id="stat-correct">
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="label">Incorrect Answers</div>
                <div class="value coral" id="stat-incorrect">
                    0
                </div>
            </div>

        </div>


        <div class="trail-header" style="margin-top:6px;">

            <h1>Welcome back</h1>

            <p id="dash-msg">
                Pick up where you left off on the trail below.
            </p>

        </div>

        <div id="dash-recent"></div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

<script>
    loadData();
</script>


<script src="{{ url_for('static', filename='js/auth-guard.js') }}"></script>
</body>
</html>

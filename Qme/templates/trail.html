<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Question Me - Level Trail</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="brand">

            <div class="brand-mark">IQ</div>

            <div>
                <div class="brand-name">Question Me</div>
                <div class="brand-sub">Aptitude Test</div>
            </div>

        </div>


        <div class="nav">

            <button onclick="location.href='/dashboard'">
                Dashboard
            </button>

            <button onclick="location.href='/trail'"
                    class="active">
                Level Trail
            </button>

            <button onclick="location.href='/calendar'">
                Calendar
            </button>
            <button onclick="location.href='/about'">
                About
            </button>
            <button onclick="location.href='/help'">
                Help
            </button>
            <button id="logout-btn" class="logout-btn">
                Logout
            </button>

        </div>

    </div>


    <!-- LEVEL TRAIL -->

    <div id="view-trail">

        <div class="trail-header">

            <h1>20-Level Aptitude Trail</h1>

            <p>
                15 questions · 15 minutes ·
                Quant, Logical & Coding.
            </p>

        </div>


        <div class="trail" id="trail"></div>

    </div>

</div>
<!-- Level intro overlay -->

<div class="overlay hidden" id="level-overlay">

    <div class="panel">

        <h2 id="ov-title">Level 1</h2>

        <div class="sub" id="ov-sub">
            Foundations · Quant, logical & coding basics
        </div>

        <div class="meta-row">

            <div class="chip">
                15 questions
            </div>

            <div class="chip">
                15 minutes
            </div>

            <div class="chip" id="ov-best">
                Best: —
            </div>

        </div>

        <button class="btn btn-primary" id="ov-start">
            Start Level
        </button>

        <button class="btn btn-ghost" id="ov-cancel">
            Cancel
        </button>

    </div>

</div>


<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/question_data.js') }}"></script>
<script src="{{ url_for('static', filename='js/question_generator.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>

<script src="{{ url_for('static', filename='js/trail.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

<script src="{{ url_for('static', filename='js/auth-guard.js') }}"></script>
</body>

</html>
